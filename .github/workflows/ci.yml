name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest # 4 vCPUs: the tests pin event loops to cores 1 to 3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --release
      - run: cargo clippy --all-targets --release --features io-uring
      - run: cargo test --release
      - run: cargo test --release --features io-uring
      - run: cargo test # debug: debug assertions in the rings
      - run: cargo doc --no-deps --features io-uring

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - run: cargo build --all-targets
